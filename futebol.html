<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=960, user-scalable=no">
<title>Temas — PS3 Hub</title>

<style>
body, html {
    margin: 0;
    padding: 0;
    background: url('https://github.com/pudimn712/Resk-Utility-Hub/blob/main/background.png?raw=true') no-repeat top center;
    background-size: cover;
    font-family: Arial, sans-serif;
    height: 100%;
    color: #39FF14;
}

/* MENU */
.menu {
    display: flex;
    background-color: #111;
    padding: 5px;
    border-bottom: 2px solid #39FF14;
}

.menu ul {
    list-style: none;
    margin: 0;
    padding: 0;
}

.menu > ul > li {
    position: relative;
    float: left;
}

.menu a {
    display: block;
    padding: 8px 15px;
    color: #39FF14;
    text-decoration: none;
    font-size: 14px;
    text-transform: uppercase;
    white-space: nowrap;
}

.menu li:hover > a {
    background-color: #1a1a1a;
    color: #fff;
}

/* DROPDOWN (mantido caso precise futuramente) */
.menu ul ul {
    display: none;
    position: absolute;
    background-color: #111;
    width: 220px;
    border: 1px solid #39FF14;
    z-index: 99;
}

.menu ul li:hover > ul {
    display: block;
}

.menu ul ul li {
    width: 100%;
}

.menu ul ul a {
    padding: 10px;
    border-bottom: 1px solid #000;
    color: #fff;
}

.menu ul ul a:hover {
    background-color: #1f1f1f;
    color: #39FF14;
}

/* RESPONSIVO */
@media screen and (max-width: 960px){
    .menu { display: block; }
    .menu ul li { float: none; width: 100%; }
    .menu ul ul { position: relative; width: 100%; }
}
</style>
</head>
