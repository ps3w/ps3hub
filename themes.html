<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: url('https://github.com/pudimn712/ps3hub/blob/main/background.png?raw=true') no-repeat center top;
    background-size: cover;
    color: #39FF14;
}

/* MENU COMPATÍVEL COM O INDEX */
.menu {
    display: block;
    background-color: #111;
    padding: 5px;
    border-bottom: 2px solid #39FF14;
    min-height: 40px;
}

.menu::after {
    content: "";
    display: block;
    clear: both;
}

.menu ul {
    list-style: none;
    margin: 0;
    padding: 0;
}

.menu > ul > li {
    position: relative;
    float: left;
}

.menu a {
    display: block;
    padding: 8px 15px;
    color: #39FF14;
    text-decoration: none;
    font-size: 14px;
    text-transform: uppercase;
    white-space: nowrap;
}

.menu li:hover > a {
    background-color: #1a1a1a;
    color: #fff;
}

/* Submenu (mesmo padrão do index) */
.menu ul ul {
    display: none;
    position: absolute;
    background-color: #111;
    width: 220px;
    border: 1px solid #39FF14;
    z-index: 999;
}

.menu ul li:hover > ul {
    display: block;
}

.menu ul ul li {
    width: 100%;
}

.menu ul ul a {
    padding: 10px;
    border-bottom: 1px solid #000;
    color: #fff;
}

.menu ul ul a:hover {
    background-color: #1f1f1f;
    color: #39FF14;
}

/* RESPONSIVO */
@media screen and (max-width: 960px){
    .menu { display: block; }
    .menu ul li { float: none; width: 100%; }
    .menu ul ul { position: relative; width: 100%; }
}
</style>
</head>
