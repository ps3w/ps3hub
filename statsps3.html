<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>Status do PS3</title>
<style>
body {margin:0; padding:0; background:#000; color:#39FF14; font-family:Arial; text-align:center;}
</style>
</head>
<body>

<h1 id="title">Detectando dispositivo...</h1>
<p id="info"></p>

<div id="ps3data" style="display:none;">
  <p>Console: <span id="console">--</span></p>
  <p>Navegador: <span id="nav">--</span></p>
  <p>Idioma: <span id="lang">--</span></p>
  <p>Resolução: <span id="res">--</span></p>
  <p>FPS: <span id="fps">--</span></p>
  <p>Firmware: <span id="fwtype">--</span></p>
  <p>CPU: <span id="cpu">--</span></p>
  <p>RSX: <span id="rsx">--</span></p>
  <p>Fan: <span id="fan">--</span></p>
  <p>FW: <span id="fw">--</span></p>
  <p>Syscon: <span id="sys">--</span></p>
  <p>Memória: <span id="mem">--</span></p>
  <p>Uptime: <span id="upt">--</span></p>
</div>

<script>
// DETECÇÃO DE DISPOSITIVO
var ua = navigator.userAgent.toLowerCase();
var isPS3 = ua.indexOf("playstation 3") !== -1;

if (!isPS3) {
  document.getElementById('title').innerText = "⚠ ACESSO INVÁLIDO";
  var d = "PC";
  if (ua.indexOf("mobile")!==-1 || ua.indexOf("android")!==-1 || ua.indexOf("iphone")!==-1) d="Mobile";
  document.getElementById('info').innerText = "Este recurso só funciona no navegador do PS3.\nDetectado: " + d;
} else {
  document.getElementById('title').innerText = "Status do PS3";
  document.getElementById('info').innerText = "";
  document.getElementById('ps3data').style.display = "block";

  // FUNÇÃO SIMPLES PARA ATUALIZAR TEXTO
  function setText(id,text){ var e=document.getElementById(id); if(e) e.innerText=text; }

  setText("console","PS3 Detectado");
  setText("nav",navigator.userAgent);
  setText("lang",navigator.language);
  setText("res",screen.width + " x " + screen.height);

  if(ua.indexOf("HEN")!==-1) setText("fwtype","PS3HEN");
  else if(ua.indexOf("CFW")!==-1) setText("fwtype","CFW");
  else setText("fwtype","OFW / Sem HEN detectado");

  // FPS básico
  var frames=0, last=Date.now();
  setInterval(function(){
    frames++;
    var now=Date.now();
    if(now-last>=1000){
      setText("fps",frames+" FPS");
      frames=0; last=now;
    }
  },16);

  // Atualização simples WebMAN (fetchs básicos)
  var eps = ["cpursx.ps3","fan.ps3","ps3fw.ps3","systemp.ps3","mem.ps3","uptime.ps3"];
  function atualizar(){
    for(var i=0;i<eps.length;i++){
      (function(ep){
        fetch("http://127.0.0.1/"+ep)
        .then(function(r){ return r.text(); })
        .then(function(t){
          if(ep=="cpursx.ps3"){ var c=t.split("/"); setText("cpu",c[0]+" °C"); setText("rsx",c[1]+" °C"); }
          else if(ep=="fan.ps3") setText("fan",t.trim()+" RPM");
          else if(ep=="ps3fw.ps3") setText("fw",t.trim());
          else if(ep=="systemp.ps3") setText("sys",t.trim()+" °C");
          else if(ep=="mem.ps3") setText("mem",t.trim());
          else if(ep=="uptime.ps3") setText("upt",t.trim());
        }).catch(function(){ setText("erro","❌ WebMAN não detectado"); });
      })(eps[i]);
    }
  }
  setInterval(atualizar,2000);
  atualizar();
}
</script>

</body>
</html>
